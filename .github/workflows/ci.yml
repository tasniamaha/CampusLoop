name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    timeout-minutes: 15  
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: campusloop_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_DATABASE: campusloop_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 3306
      TEST_DB_USER: root
      TEST_DB_PASSWORD: root
      TEST_DB_NAME: campusloop_test
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/api/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Unit tests
        run: npm test
      - name: Apply migrations to the CI database
        run: npx typeorm-ts-node-esm migration:run -d src/database/data-source.ts
      - name: App e2e tests (auth guard, rate limit)
        run: npx vitest run --config vitest.config.e2e.ts test/app.e2e-spec.ts
      - name: Concurrency tests (real MySQL)
        run: npx vitest run --config vitest.config.e2e.ts test/borrow-concurrency.e2e-spec.ts
      - name: Borrow expiry sweep tests (real MySQL)
        run: npx vitest run --config vitest.config.e2e.ts test/borrow-expiry.e2e-spec.ts
      - name: Email verification tests (real MySQL)
        run: npx vitest run --config vitest.config.e2e.ts test/email-verification.e2e-spec.ts
      - name: Password reset tests (real MySQL)
        run: npx vitest run --config vitest.config.e2e.ts test/password-reset.e2e-spec.ts
      - name: Password reset HTTP tests
        run: npx vitest run --config vitest.config.e2e.ts test/password-reset-http.e2e-spec.ts
      - name: Audit log tests (real MySQL)
        run: npx vitest run --config vitest.config.e2e.ts test/audit-logs.e2e-spec.ts
      - name: Email verification HTTP tests
        run: npx vitest run --config vitest.config.e2e.ts test/email-verification-http.e2e-spec.ts
      - name: Notification & reminder tests (real MySQL + Redis)
        run: npx vitest run --config vitest.config.e2e.ts test/notifications-queue.e2e-spec.ts
      - name: Review service tests (real MySQL)
        run: npx vitest run --config vitest.config.e2e.ts test/reviews.e2e-spec.ts
      - name: Review HTTP tests (auth, validation, moderation)
        run: npx vitest run --config vitest.config.e2e.ts test/reviews-http.e2e-spec.ts
      - name: Review flow HTTP tests (borrow to return to review)
        run: npx vitest run --config vitest.config.e2e.ts test/reviews-flow-http.e2e-spec.ts
      - name: Refresh token rotation tests (real MySQL)
        run: npx vitest run --config vitest.config.e2e.ts test/refresh-tokens-http.e2e-spec.ts
      - name: Moderation report tests (queue, roles, campus scoping)
        run: npx vitest run --config vitest.config.e2e.ts test/moderation-reports.e2e-spec.ts
      - name: Moderation report target tests (resources, lost-found)
        run: npx vitest run --config vitest.config.e2e.ts test/moderation-report-targets.e2e-spec.ts
      - name: Resource image storage tests (folder isolation)
        run: npx vitest run --config vitest.config.e2e.ts test/resource-images-http.e2e-spec.ts
      - name: Lost-and-found photo tests (upload, privacy, limits)
        run: npx vitest run --config vitest.config.e2e.ts test/lost-found-photos-http.e2e-spec.ts
      - name: Lost-and-found report page tests (single report visibility)
        run: npx vitest run --config vitest.config.e2e.ts test/lost-found-report-detail-http.e2e-spec.ts
      - name: Lost-and-found "My reports" tests (own reports and claims only)
        run: npx vitest run --config vitest.config.e2e.ts test/lost-found-mine-http.e2e-spec.ts
      - name: Lost-and-found attribute tests (colour, brand, time window)
        run: npx vitest run --config vitest.config.e2e.ts test/lost-found-attributes-http.e2e-spec.ts
      - name: Study group concurrency tests (INV-4 participant limit, real MySQL)
        run: npx vitest run --config vitest.config.e2e.ts test/study-groups-concurrency.e2e-spec.ts
      - name: Study group page tests (group and member visibility)
        run: npx vitest run --config vitest.config.e2e.ts test/study-groups-detail-http.e2e-spec.ts
      - name: Study group "My groups" tests (own groups and requests only)
        run: npx vitest run --config vitest.config.e2e.ts test/study-groups-mine-http.e2e-spec.ts
      - name: Deactivation tests (accounts and categories)
        run: npx vitest run --config vitest.config.e2e.ts test/deactivation-http.e2e-spec.ts
      - name: Admin users tests (roles, deactivation, last-admin lock under concurrency)
        run: npx vitest run --config vitest.config.e2e.ts test/admin-users-http.e2e-spec.ts
      - name: Admin categories tests (create, rename, deactivate, no delete)
        run: npx vitest run --config vitest.config.e2e.ts test/admin-categories-http.e2e-spec.ts
      - name: Admin audit log and analytics tests
        run: npx vitest run --config vitest.config.e2e.ts test/admin-audit-analytics-http.e2e-spec.ts
      - name: Admin CSV export tests (formula escaping, field allowlist, row cap, audited)
        run: npx vitest run --config vitest.config.e2e.ts test/admin-exports-http.e2e-spec.ts
      - name: Admin promote CLI tests (bootstrap first admin, needs the build above)
        run: npx vitest run --config vitest.config.e2e.ts test/admin-promote-cli.e2e-spec.ts
      - name: Deactivation migration tests (restores schema)
        run: npx vitest run --config vitest.config.e2e.ts test/deactivation-migration.e2e-spec.ts
      - name: Lost-and-found photo migration tests (restores schema)
        run: npx vitest run --config vitest.config.e2e.ts test/lost-found-photos-migration.e2e-spec.ts
      - name: Lost-and-found attribute migration tests (restores schema)
        run: npx vitest run --config vitest.config.e2e.ts test/lost-found-attributes-migration.e2e-spec.ts
      - name: Review migration tests (runs last, restores schema)
        run: npx vitest run --config vitest.config.e2e.ts test/review-migrations.e2e-spec.ts
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    env:
      API_URL: http://localhost:3001/api
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      # Build first: the Referrer-Policy tests start `next start` on this build (they fail without it when CI is set).
      - run: npm run build
      - name: Tests (proxy session renewal, Referrer-Policy headers)
        run: npm test