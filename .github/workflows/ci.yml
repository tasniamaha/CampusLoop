name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: campusloop_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_DATABASE: campusloop_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 3306
      TEST_DB_USER: root
      TEST_DB_PASSWORD: root
      TEST_DB_NAME: campusloop_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/api/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Unit tests
        run: npm test
      - name: Apply migrations to the CI database
        run: npx typeorm-ts-node-esm migration:run -d src/database/data-source.ts
      - name: App e2e tests (auth guard, rate limit)
        run: npx vitest run --config vitest.config.e2e.ts test/app.e2e-spec.ts
      - name: Concurrency tests (real MySQL)
        run: npx vitest run --config vitest.config.e2e.ts test/borrow-concurrency.e2e-spec.ts

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    env:
      API_URL: http://localhost:3001/api
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - name: Lint (informational for now)
        run: npm run lint
        continue-on-error: true
      - run: npm run build